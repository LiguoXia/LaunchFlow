name: Signed release candidate artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: node scripts/cargo.mjs install cargo-audit --version 0.22.2 --locked
      - run: node scripts/cargo.mjs audit
  package:
    needs: dependency-audit
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      LAUNCHFLOW_UPDATE_URL: ${{ vars.LAUNCHFLOW_UPDATE_URL }}
      LAUNCHFLOW_UPDATE_PUBLIC_KEY: ${{ vars.LAUNCHFLOW_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add ${{ matrix.target }}
      - run: npm ci
      - run: npm test
      - run: node scripts/cargo.mjs fmt --all -- --check
      - run: node scripts/cargo.mjs clippy --workspace --all-targets -- -D warnings
      - run: node scripts/cargo.mjs test -p launchflow-core
      - name: Import Windows certificate into ephemeral runner
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE_BASE64) { throw 'Windows signing certificate is required' }
          $certificateFile = Join-Path $env:RUNNER_TEMP 'launchflow-signing.pfx'
          [IO.File]::WriteAllBytes($certificateFile,[Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificateFile -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (!$certificate.HasPrivateKey) { throw 'Private signing key unavailable' }
            "WINDOWS_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          } finally { Remove-Item -LiteralPath $certificateFile -Force }
          $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw 'SignTool unavailable' }
          "SIGNTOOL_PATH=$($signTool.FullName)" >> $env:GITHUB_ENV
      - name: Import Apple certificate and notary key into ephemeral runner
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_BASE64" && test -n "$APPLE_API_KEY_BASE64"
          certificate_path="$RUNNER_TEMP/launchflow-signing.p12"
          keychain_path="$RUNNER_TEMP/launchflow-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$certificate_path" "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          rm "$certificate_path"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: node scripts/release-preflight.mjs
      - run: node scripts/build-native.mjs --target ${{ matrix.target }}
      - run: node scripts/sign-native.mjs
      - name: Build signed and notarized artifacts
        run: node scripts/tauri.mjs build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config .local/release.json
        env:
          LAUNCHFLOW_NATIVE_PREBUILT: '1'
      - name: Verify signed updater artifacts
        run: node scripts/verify-release.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: signed-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/
            artifacts/release-verification-${{ matrix.target }}.json
          if-no-files-found: error
      - name: Clean temporary Apple keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/launchflow-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/launchflow-signing.p12"
