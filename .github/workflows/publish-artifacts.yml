name: Publish verified desktop artifacts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and publish desktop releases run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify the source build run
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/source-run.json', 'utf8'));
          if (run.status !== 'completed' || run.conclusion !== 'success' || run.path !== '.github/workflows/publish.yml')
            throw Error('Only successful desktop package runs can be published');
          if (!/^[0-9a-f]{40}$/.test(run.head_sha)) throw Error('Invalid source commit');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${run.head_sha}\n`);
          NODE
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prepare the exact release tag
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$tag" HEAD
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          path: artifacts/github-release
          merge-multiple: true
      - name: Recheck all assets and publish
        run: node scripts/publish-release.mjs
        env:
          GITHUB_REF_NAME: ${{ steps.version.outputs.tag }}
